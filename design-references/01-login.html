<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Foothold — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="hifi.css" />
<link rel="stylesheet" href="hifi-screens.css" />
</head>
<body>

<main class="hf-auth" data-screen-label="Sign in / Sign up">
  <div class="hf-auth-card">
    <div class="hf-auth-brand">
      <span class="hf-brand-mark"><span>F</span></span>
      <h1>Foothold</h1>
      <div class="tag">Learn to trade — one step at a time.</div>
    </div>

    <div class="hf-stack-sm">
      <button class="hf-choice primary">
        <div class="emoji">👋</div>
        <div class="text">
          <div class="t">I'm new here</div>
          <div class="s">Takes 2 minutes. No money needed.</div>
        </div>
        <svg class="arr" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </button>

      <button class="hf-choice">
        <div class="emoji">🔑</div>
        <div class="text">
          <div class="t">I have an account</div>
          <div class="s">Pick up where you left off.</div>
        </div>
        <svg class="arr" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </button>
    </div>

    <div class="hf-divider-text">or sign in with</div>

    <div class="hf-social-row">
      <button class="hf-social" aria-label="Continue with Google">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.27c0-.73-.07-1.43-.2-2.1H12.2v3.97h5.78c-.25 1.36-1 2.5-2.16 3.27v2.7h3.5c2.05-1.9 3.18-4.69 3.18-7.84z"/><path fill="#34A853" d="M12.2 22.5c2.92 0 5.36-.96 7.15-2.6l-3.5-2.7c-.97.65-2.2 1.04-3.65 1.04-2.8 0-5.18-1.89-6.03-4.43H2.55v2.78A10.27 10.27 0 0012.2 22.5z"/><path fill="#FBBC04" d="M6.18 13.81a6.16 6.16 0 010-3.92V7.1H2.55a10.3 10.3 0 000 9.4l3.63-2.69z"/><path fill="#EA4335" d="M12.2 5.45c1.59 0 3 .55 4.13 1.62l3.1-3.1A10.3 10.3 0 002.55 7.1l3.63 2.79c.85-2.55 3.23-4.44 6.02-4.44z"/></svg>
      </button>
      <button class="hf-social" aria-label="Continue with Apple">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 12.04c-.03-2.71 2.22-4.01 2.32-4.07-1.27-1.85-3.24-2.1-3.94-2.13-1.68-.17-3.27.99-4.13.99-.85 0-2.16-.97-3.55-.94-1.83.03-3.51 1.06-4.45 2.69-1.9 3.29-.48 8.15 1.36 10.83.9 1.31 1.97 2.78 3.36 2.72 1.35-.05 1.86-.87 3.49-.87 1.63 0 2.09.87 3.52.84 1.45-.03 2.37-1.33 3.26-2.65 1.03-1.52 1.45-2.99 1.47-3.07-.03-.01-2.82-1.08-2.84-4.34zM14.38 4.06c.74-.9 1.24-2.14 1.1-3.38-1.07.04-2.36.71-3.13 1.6-.69.79-1.29 2.05-1.13 3.26 1.19.09 2.42-.6 3.16-1.48z"/></svg>
      </button>
      <button class="hf-social" aria-label="Continue with email">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </button>
      <button class="hf-social" aria-label="Continue with phone">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.37 1.9.72 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0122 16.92z"/></svg>
      </button>
    </div>

    <div style="text-align:center;margin-top:var(--sp-5)">
      <div class="hf-mini-foot">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Bank-grade security · Practice money only
      </div>
    </div>

    <div style="text-align:center;margin-top:var(--sp-4);font-size:11px;color:var(--ink-faint);">
      By continuing you agree to our <a href="#" style="color:var(--ink-soft);text-decoration:underline;">Terms</a> and <a href="#" style="color:var(--ink-soft);text-decoration:underline;">Privacy Policy</a>.
    </div>
  </div>
</main>

<div id="tweaks-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="hifi-tweaks.jsx"></script>

</body>
</html>
